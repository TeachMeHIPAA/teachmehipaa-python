name: Docs

# Builds the pdoc API reference on every pull request and push, failing on
# any pdoc warning, and publishes it to GitHub Pages from `main`. Pages must
# be enabled with "GitHub Actions" as the source (see CONTRIBUTING.md).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a Pages deployment halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build the API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Generated resource reference is current
        run: uv run python scripts/generate.py --check
      - name: Build with pdoc, warnings as errors
        run: >-
          uv run python -W error::UserWarning -m pdoc --docformat google
          --output-directory site
          teachmehipaa teachmehipaa.types teachmehipaa.resources
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
