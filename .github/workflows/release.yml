name: Release

# Manual only. A run without `publish` checks, builds and inspects the release
# but publishes nothing; with it, it also publishes the inspected files to
# PyPI through trusted publishing. pyproject.toml keeps the
# `Private :: Do Not Upload` classifier until launch, and PyPI rejects any
# upload that carries it, so even a mistaken `publish` run fails at the upload
# (see CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (fails while the Private classifier is set)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      # The contract suite runs Prism through npx.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: uv sync --locked
      - name: Generated code is current
        run: uv run python scripts/generate.py --check
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy
      - name: Unit tests and README samples
        run: uv run pytest
      - name: Contract tests
        run: uv run pytest -m contract
      - name: Build
        run: uv build
      - name: Check the distributions
        run: uvx twine@7.0.0 check --strict dist/*
      - name: List the wheel's files
        run: python -m zipfile -l dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/teachmehipaa/
    permissions:
      contents: read
      # PyPI trusted publishing exchanges this OIDC token for a short-lived
      # upload credential; no PyPI token is stored in the repository.
      id-token: write
    steps:
      # Publish exactly the files the verify job built and checked.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
