[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "teachmehipaa"
dynamic = ["version"]
description = "Official Python library for the TeachMeHIPAA Developer API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.5,<3",
  "typing-extensions>=4.7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/TeachMeHIPAA/teachmehipaa-python"

[dependency-groups]
dev = [
  "jsonschema>=4.26.0",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.version]
path = "src/teachmehipaa/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/teachmehipaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]
# Research docs quote other projects' code verbatim.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "ASYNC", "S", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
